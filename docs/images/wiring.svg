<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-label="Wiring between MH-SD and a classic ESP32">
<title>Wiring between MH-SD and a classic ESP32</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#196656"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192a31}.title{font-size:30px;font-weight:700}.small{font-size:17px;fill:#52646a}.label{font-size:21px;font-weight:600}.mono{font-family:Consolas,monospace;font-size:19px}.white{fill:#fffefa}.green{fill:#196656}</style>
<rect width="1100" height="670" rx="12" fill="#f2f0eb"/>
<text x="40" y="54" class="title">Follow the printed pin names</text>
<text x="40" y="87" class="small">Unplug USB before changing wires or moving the SD card.</text>
<rect x="55" y="120" width="260" height="430" rx="10" fill="#fffefa" stroke="#ced5d3"/>
<rect x="725" y="120" width="315" height="430" rx="10" fill="#fffefa" stroke="#ced5d3"/>
<text x="85" y="155" class="label">MH-SD module</text><text x="755" y="155" class="label">ESP32-WROOM-32</text>
<text x="248" y="201" text-anchor="end" class="mono">GND</text><circle cx="280" cy="195" r="7" fill="#394b53"/><path d="M288 195H752" stroke="#394b53" stroke-width="5"/><circle cx="760" cy="195" r="7" fill="#394b53"/><text x="790" y="201" class="mono">GND</text><text x="248" y="255" text-anchor="end" class="mono">5V</text><circle cx="280" cy="249" r="7" fill="#ae4936"/><path d="M288 249H752" stroke="#ae4936" stroke-width="5"/><circle cx="760" cy="249" r="7" fill="#ae4936"/><text x="790" y="255" class="mono">5V / VIN</text><text x="248" y="309" text-anchor="end" class="mono">CS</text><circle cx="280" cy="303" r="7" fill="#8a6418"/><path d="M288 303H752" stroke="#8a6418" stroke-width="5"/><circle cx="760" cy="303" r="7" fill="#8a6418"/><text x="790" y="309" class="mono">GPIO27</text><text x="248" y="363" text-anchor="end" class="mono">MOSI</text><circle cx="280" cy="357" r="7" fill="#735a94"/><path d="M288 357H752" stroke="#735a94" stroke-width="5"/><circle cx="760" cy="357" r="7" fill="#735a94"/><text x="790" y="363" class="mono">GPIO23</text><text x="248" y="417" text-anchor="end" class="mono">SCK / CLK</text><circle cx="280" cy="411" r="7" fill="#196656"/><path d="M288 411H752" stroke="#196656" stroke-width="5"/><circle cx="760" cy="411" r="7" fill="#196656"/><text x="790" y="417" class="mono">GPIO18</text><text x="248" y="471" text-anchor="end" class="mono">MISO</text><circle cx="280" cy="465" r="7" fill="#326b9b"/><path d="M288 465H752" stroke="#326b9b" stroke-width="5"/><circle cx="760" cy="465" r="7" fill="#326b9b"/><text x="790" y="471" class="mono">GPIO19</text><text x="85" y="522" class="small">3V3: disconnected*</text>
<text x="40" y="593" class="small">*For a module with a 5V input, 3.3 V regulator and suitable level shifting.</text>
<text x="40" y="623" class="small">Never feed 5 V into a bare SD card or a 3.3 V-only module.</text>
<text x="40" y="653" class="small">Schematic illustration. Physical pin positions vary between boards.</text></svg>